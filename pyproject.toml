[project]
name = "ankikit"
version = "0.1.0"
description = "その日の学習を振り返って Anki デッキに落とし込むための道具箱"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",   # カードファイルのフロントマター
    "requests>=2.34.2",  # AnkiConnect への HTTP
]

[project.scripts]
ankikit = "ankikit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankikit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
